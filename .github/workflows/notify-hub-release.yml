# Copy to a tool repository as .github/workflows/notify-hub-release.yml.
# Keep notify-hub.yml as well: push notifications update source pointers;
# this workflow tells the hub to refresh its published-release catalog.
#
# Reuse HUB_DISPATCH_TOKEN, scoped to the canonical hub repository with
# Contents: read and write. No additional secret or tool-repository access
# is needed. Missing credentials fail visibly: there is no nightly fallback.
#
# Run manually from Actions to verify notification or recover a missed event.
# The hub resolves the latest published release itself, so a manual run does
# not create a release or change a version. Catalog changes still require a PR.
name: Notify hub of a release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

concurrency:
  group: notify-hub-release-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false
    steps:
      - name: Notify the hub catalog
        env:
          TOKEN: ${{ secrets.HUB_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::HUB_DISPATCH_TOKEN is not configured. Add the hub-scoped secret and rerun this workflow."
            exit 1
          fi

          payload=$(jq -nc --arg repository "$GITHUB_REPOSITORY" \
            '{event_type: "release-published", client_payload: {repository: $repository}}')

          curl --fail --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/falorfrozen-cmd/hero-siege-offline-toolkit/dispatches \
            --data "$payload"

          echo "Release notification delivered to the toolkit hub."
